  "Rescue Pup": "On the far edge of town in the thick of the woods curved a long winding road where a tiny house stood. \nAll alone in that house sat a pup who was sad. There was no one to play with no friends to be had. \nWhile he waited and watched for the door to unlock, it grew dark in the house . . .\nThen he heard a loud -KNOCK!\nThere was no one outside, just the wicked old winds that ripped through the trees and tore down the limbs! \nAs dark gloomy clouds blew over the moon, lightning bolts flashed and thunder ka-BOOMED!\nThe little dog dashed up the stairs, down the hall, and he shook all night long from the sounds of the squall.\nBy morning the storm was over and done. The rain cleared up and out came the sun.\nThe puppy was hungry. He looked all around for water and food. There was none to be found.\nSoon day became night and then daytime once more, but no one came home to unlock the front door. So he howled and he whimpered in terrible fear that no one would rescue him — no one would hear!\nThis poor lonesome pup couldn't wait any more, so he clawed at the windows and pawed on the doors. He pushed on a screen, scratched a hole ‘til it grew. Then he twisted and shoved and squeezed his way through.\nHe was free now at last as he crept very slow through the woods and the darkness not sure where to go. Coming out of the trees, he found danger too soon. He was chased down the path by a mean old raccoon. As he ran through a field, there were sharp prickly burrs that stuck to his toes, and his legs, and his fur. He was hurt once again on his way into town when he stepped on some glass all scattered around.\nHe kept looking for someone, a friend who might care, but instead he heard Scram! So he ran far from there. Then he faced the worst danger of all on that night — A highway! Fast cars! Headlights blinding his sight! He stopped. Then he turned. When he started to go, a car blared its horn, tires screeched, and — Oh, NO! The car quickly stopped; someone opened the door. The pup froze!\nCould he possibly take anymore?\nThen a lady stepped out. Little Buddy! she cried. Are you lost? Are you hurt? Let me get you inside! He was glad to be rescued and happy to find a friend who could help him — someone who was kind. The little pup loved his first ride in a car 'til the lady said, Buddy, get up! Here we are! ",

  "Best Friends":"Zindzi and Tim Tam were best friends. They did everything together.\n Do you want to play dress-up? asked Oswin. No thank you, said Zindzi. \nI’ll play dress-up with Tim Tam. Do you want to do a puzzle with me? -asked Kaya. No thank you, -said Zindzi.\n I like doing puzzles with Tim Tam. Do you want to join our scooter race? -asked The Twins. No thank you, -said Zindzi.\n I’ll race with Tim Tam. One day, Tim Tam didn’t come to school.\n Tim Tam is sick, -said Teacher. Why don’t you play with your other friends, Zindzi? Oswin was making a -Get Well Soon- card for Tim Tam. But… Tim Tam is my best friend, said Zindzi.\n You can help me, -said Oswin. Dip dip, -dab dab Dip dip, dab dab- -said Zindzi. When the card was done, Oswin and Zindzi played dress-up.\nThe next day, they played hopscotch with Kaya.\n The day after that, the three of them rode scooters with the Twins.\nOn Monday, Tim Tam came back to school. Let’s go read a book with Oswin! -said Zindzi.\n Is Oswin your best friend now? -asked Tim Tam. He’s my new friend, -said Zindzi. \nHe’s your friend too! Look, we made you a card.\nShould we all play together? Okay, -said Tim Tam. Let’s all be best friends!",
  
  "Rescue Kitty":"On a warm summer night right outside my backdoor shadows passed, green eyes flashed.\nThen I saw them no more. Had I seen a red fox, a possom, an owl?\nMaybe something nocturnal was out on the prowl.\nSo I ran to the bushes and yanked them apart, but whatever it was shot off like a dart.\nMom called from the house, ”Luis, it is late!\nThe mystery creature would just have to wait.\nWhen the sun poked its head on the very next day, I flew out of bed to run outside and play!\nI remembered the eyes, so I gazed all around. Sure enough on the woodpile a cat hunkered down.\nI gasped! Then I froze. We locked eyes, and I stared. I could see she was feeling uneasy and scared.\nI called, Here Kitty Kitty, but with one graceful push, she leaped from her perch and was lost in the bush. I hunted and hunted; no cat was in sight. I hoped she'd come back, and I thought she just might. She surprised me again curled up on the mat. Oh, I had to tell Mom about Cally-co cat. Mom said, This cat is frail; she is hungry and thin.\nI'm not sure where she came from, or where she has been. But it's time someone cared, for she needs a good meal.\nWith those scratches and cuts, she could use time to heal. So we filled up a pan with fresh milk and chow.\nAfter gulping it down, she sang friendly meows. We invited her in, but she lingered outside.\nWe wondered if Cally had something to hide. In the late afternoon, winds blew in from the West.\nRaindrops pelted the ground. Cally acted distressed!\nAs she paced on the porch, she peered over the wall, reaching down with her paw toward what looked like a ball.\nBranches twisted and bent. Oak trees whipped overhead. As the dark sky flashed white, my heart filled with dread!\nTiny kittens! I saw them! With shrill desperate cries, they clung to each other beneath stormy skies.\nMom! I yelled pointing at kittens below. Cally's trying to save them.\nLet's help her. Let's go!\n So we put on our coats; down the porch steps we flew, and we battled the storm scooping kittens up, too.\nThen we hurried inside holding all of them tight. Cally trotted behind us — her kittens in sight!\nShe counted each baby now safe from all harm, then frantically ran to the door in alarm! Cally leaped off the porch swiftly searching around beneath boxwoods and hostas and finally found\nONE kitten we'd left all alone in the rain. He was stuck in a thorn bush and cried out in pain!\nWe carefully freed him and calmed him down, too. Soon he settled right in with the rest of his crew. Cally's family at last — safe and sound not a peep bellies full, cozied up, snug and warm, fast asleep.\nThe weeks flew by quickly. The kittens had grown. Time to visit the vet. Time to find them new homes.\nCally saw the vet, too for a check up and spay. Her new home was with me, and forever she'd stay!",
  // vége ***
  "The Hunt for H. G. Growmore. - CHAPTER 1":"The Hunt for H G Growmore. \nThis is awful, muttered Isabella in a low, wobbly voice. Behind her on the only bed in the room, Kay did not react. \nThe half-length mirror in front of Isabella showed him clearl, lying on her pillows, absentmindedly rubbing his upper lip with a finger. His eyes did not leave the page facing him - a funny-looking picture of some sort of aliens was on the book cover. Aliens Humph! “It’s really, really dreadful,” she added hopefully, sneaking a look at him over one shoulder. Kay seemed carved from stone. Even his eyes didn’t blink now. What on earth was so fascinating about visitors from another world? \nWhat about people from this planet? Like, his kid sister, for instance. \nIt’s terrible! Isabella yelled, smacking a palm on the mirror for good measure, making Kay jump two feet off the bed. \nThe book fell from his hands. \nHe gaped at Isabella in astonishment, quite speechless. There, much better, Isabella started to smile, then caught a glimpse of herself in the mirror.\nThe smile vanished like her pocket money halfway through the month.\nI don’t believe this! Just unthinkable! She moaned, staring with wide eyes at her reflection in the mirror. \nThe Image that stared back, eyes alarmed, long wispy hair all awry, was that of a pubescent female, skin like the sunset of a day spent on the beach, much too tall for her age, with a perky, slightly upturned nose adorning a decidedly pretty face. Mommy said Isabella’s nose was her most visible facial feature; “walking nose first,” she termed it, shaking her head with indulgent pride. Teacher Ngozi at school wasn’t such a fan, though. \nShe opined, that Bella in JSS 3 that nose of hers looks like it always wants to tell everyone what to do- and how to do it too! Right at the moment, however, Isabella’s nose was the last thing on her mind. She really couldn’t bear it. It was a totally awful, awful thing to be happening! And what could she do? The funny thing was, this was absolutely the worst day to feel awful about anything. To start with, outside, the July sun blazed happily on a world filled with singing birds and happy, playing children. Up and down the street in this residential Estate in Kaduna City, one could almost touch the palpable euphoria in the air. And with reason too. This was the first day of the long holidays, the long vac as school kids all over the country called it. They were the height of every Nigerian Kid’s year, looked forward to with ever-mounting excitement as they slowly approached. 7 glorious school-free weeks! With absolutely nothing- or everything to do, depending on one’s personal energy level. The air fairly hummed with plans being made, even if they were just thoughts of lazing around the house, bedroom, beach, garden, poolside, or stream, watching tiktoks, glued in front of a tv screen, with a fav book or movie, or absolutely nothing at all.\nWhatever chilled your ice cream. Kids everywhere were in holiday heaven. However, Isabella was not thinking about the holidays either. She gasped as she ran a long comb through her hair once more. Several fine strands came away with the comb. Others floated softly to the floor. Now she groaned, staggering back to flop into a pretty daffodil-covered armchair by the window.\nThe bedroom was Barbie recommended pink, violet, and white.\nPictures of animated heroines, ballet dancers, singers, and actresses decorated the walls. Soft toys and sundry personal knick-knacks cluttered the modestly sized room. The July breeze wafted softly in, blowing hair across Isabella’s eyes. Impatiently, she secured the loose hair with a yellow rubber band. More strands of hair came loose in her hand. She groaned again – longer this time. “It can’t, can’t, can’t be happening!” she whimpered, “Isabella, diva of the twenty twenties, going... I can hardly even say it... b-bald! Dreadful!”\n“I did warn you.” Kay had recovered and now lay sprawled on his belly on the small pink bed across the room. He bore a noticeable resemblance to the distraught Isabella. The book was back in his hand, and he wore an orange T-Shirt which said in big white letters: “I AM PRETTY NICE, BUT YOU WILL NEVER PROVE IT.” As almost always, Kay now had a dreamy look on his face and a wistful half-smile, which hinted that he was keeping a precious secret from the world. Which he usually was especially from the grownups of that world; teachers and parents particularly. Minus Mum, though. Kay wouldn’t admit it to save his life, but his gentle, understanding mother was tops in his list of real-life heroes. Kay was just a year older than his sister, but was convinced one of his life’s missions was her thorough, if unconventional, education. “I told you a hundred times if I told you once...’\nThe act over, Kay became his old self again. He had a pleased “Boy, did I kill that,” look on his clear face. He smiled smugly and shrugged, “But do you ever listen?” “What’s that?” “What’s what?”\n“What you said. Chi- something. I wasn’t to catch my hair in it.” Kay smirked. “Chignon. With a silent g. It’s a bun of hair.” “A bun made from hair?” “Noo. A bun of hair. You know when you sweep your hair back and knot it at the nape of your neck. Like you are doing right now. That’s a chignon.” “You always do that,” sulked Isabella. “Do- what?” “You always throw long, meaningless, unknown words at me so that I’ll ask their meanings and make you feel clever.” Kay raised a dramatic hand. Now he was Professor Tom Foolery in his current favorite TV show, Tom Foolery’s house. “Now just a wee second, me dear girl, how are they possibly meaningless if one may ask their meanings, eh?” He adjusted a make-believe monocle and smoothed a make-believe mustache. Pam just glared. “That’s quite the most idiotic show on TV now, you know. Well, just look at it: He’s a professor ... and he’s a fool? Think about that for a moment, prof. ”Kay scratched his head, now very much like Sponge Bob, momentarily at a loss for good words.Kay was a movie buff of buffs. Nearly his whole life philosophy was a mish-mash of several films and Television shows. “Anyway, what has tying one’s hair in a chi-whatever! - got to do with anything?” Isabella asked impatiently. Kay brightened, back on firmer footing. It was so disconcerting to be upstaged by his 12-year-old younger sister. Lately, it had been happening too frequently for a certain level of ego comfort. He made a mental note to double- no triple, his daily vitamin intake. Should he add five more pushups to that, also? In his head, he began to count, as he imaginarily strained his widely celebrated muscles, hardly sweating: 26, 27, 34, 39...! Photographers and video bloggers stood to one side, silent in admiration, unobtrusively recording everything with the latest Devices, making sure not to disturb his concentration... 40, 65, 84! Then he caught Isabella’s narrowed eyes. Kay came back to earth with an almost audible thump. Time to instruct the young un, he surmised. He started to go into his best Prof Tom Foolery poise, then hurriedly let it slide into a casual Chris Hemsworth Lounge. One never went wrong with cool.\n Chris. Wasn’t Thor Ragnarok proof enough? “Well, now, lassy,’ he drawled, “On occasion, you do that daily, see, you create continuous tension in your hair, and pretty soon, those hairs begin to separate from their wee follicles.” Isabella glared at him. “I’m not going to ask what that means, so you’d better tell me- swiftly!” Kay grinned unrepentantly. “A follicle is the root of individual hair strands. I thought you do Biology in school.” “We haven’t done the skin.” Isabella grumbled peevishly, “Anyway, back to my problem. I won’t catch my hair in a... a... a bun again. But now what is to be done? I can’t go bald at twelve! I won’t! Do something!” Kay jumped off the bed. An extremely intelligent boy, his Sunday school teacher said Kay’s greatest failing was his absolute refusal to do anything above the barest minimum necessary. However, for his little sister, he made quite an effort from time to time. Kay stood undecided for a heartbeat, then dived on Isabella with a Zulu-Warrior-style whoop. He darted a hand to her hair and yanked off the rubber band that held her hair together. The band snapped with a loud bang. “Ouch’, yelped Bella, “What on earth did you do that for? That hurt!” Kay stared. “D-d-duh? Trying to save your hairline, recollect? “Didn’t need to half-kill me first,” Isabella grumbled, rubbing the spot furiously, releasing a shower of soft hair. She looked crossly at Kay. “Now see what you’ve made me do.” Kay put on a thoughtful expression. “Hmmn. Tricky problem, that. Well, when in doubt, see big sister wise. Come on, let’s talk to Jenny. \nThe two children exited Isabella’s bedroom. The house was fairly large, the standard 4-bedroom quarters for a senior lecturer at the State University. The two made their way through silent corridors; Kay, lingering around the kitchen with its persuasive aromas until he was chased out by Mama, their in-house cook cum housekeeper, and then past the dining area to the living room. Their big sister, Jennifer, was there with a friend, Tinu, both absorbed in a movie on the large flat TV mounted on one wall. Both girls were sixteen. “Hi, Jenny, hi Tinu.” Kay greeted, throwing himself on a chair. Kay never actually did anything simply. He wolfed down food. Gulped his drinks. His mother said he appeared to be constantly late for something. This with a very weary shake of her head. Jennifer picked up the remote control and changed the channel on the TV. “Hey!’ Kay protested, ‘that looked awesome.”\nJennifer looked at him with all the superiority of her three extra years. “It is ... very;” Kay rubbed his hands, “All right! Hit that button again, if you will, big Sis!” Jennifer smiled like the Cheshire Cat in Alice in Wonderland, “It’s also PG 16, lil bro, so ask me again in about say ... oh, three years, right?” Jennifer and Tinu giggled. Kay scowled into his chin. “Girls,” he muttered to himself. When he became head of the Global Intergalactic force ... A vision of himself in a shiny red space suit swam across Kay’s eyes. Girls in wayyy less glamorous suits crowded around him, attending to his every command. Jenny and Tinu stood on the fringes of the crowd, waving at him, but he didn’t even deign to look at them. Isabella muttered a worried hello and slumped morosely on the settee. Jennifer glanced at Isabella. “Hey, Bellyho, not looking cheery at all. What’s up?” Kay beamed down from the Intergalactic Space Station with a reluctant sigh. “She’s kind of going bald, and it’s really bugging her,” Kay stated matter-of-factly, “That’s why we’ve come. Need an ASAP solution to this one.” Jennifer and Tinu giggled, saw Isabella’s glare, and frowned gloomily. “Going bald at twelve,” Jennifer observed, “Not good, nope, not so cool at all.” Bella looked from one to the other. “And?” “I read about a friend of mine on Facebook who had the same problem two years ago,” Tinu started, “But she was seventeen at the time.” Bella perked up. “Seventeen is close enough. How did she fix it?” Tinu looked uncomfortable, “Err, she –er- basically just found a way around.” “Let me guess,” Kay said, “Cyborg Alter Ego. Now people don’t know it’s not really her. Looks like her, talks like her, walks like-” “Kay!” Bella frowned fiercely. She turned to Tinu, all attention, “Yes, Tinu? What did she do?” Tinu didn’t look so happy. “Hmnn, okay, first she kind of looked at her options. Be bald and look, well, bald; or be bald and look truly dope. Anyway, she lives in England, so she kind of got into rock n’ roll, heavy metal stuff. Not that she liked it, but she then had a cool excuse for shaving off all of her hair. She goes around bare as an egg now. And she’s cool too.” Bella stared at Tinu open-mouthed. She touched her hair unconsciously, imagining it all shaved off. “I think you would also have to paint half of your skull bright green and the other half ... orange,” Tinu finished apologetically. Bella shuddered convulsively. Kay flashed a crafty grin. Jennifer looked at Tinu and wiggled her left eyebrow, which in girl-speak meant: Hey! Not helping! Tinu shrugged and wiggled her right eyebrow: Free me! I tried! Jennifer sighed. She knew what was coming next.",

  "On the far edge of town in the thick of the woods curved a long winding road where a tiny house stood.":"A város távoli szélén, az erdő sűrűjében kanyargott egy hosszú, tekervényes út, amely mellett egy apró ház állt.",

  "There was no one to play with no friends to be had.":"Nem volt kivel játszania, nem voltak barátai.",
  "While he waited and watched for the door to unlock, it grew dark in the house . . .":"Miközben várakozott, és azt figyelte, mikor nyílik ki az ajtó, besötétedett a házban.",
  "Then he heard a loud knock!":"Aztán egy hangos... KOPOGÁST hallott!",
  "There was no one outside, just the wicked old winds that ripped through the trees and tore down the limbs!":"Kint nem volt senki, csak a gonosz, vén szelek, amelyek végigsöpörtek a fákon, és letördelték az ágakat!",
  "As dark gloomy clouds blew over the moon, lightning bolts flashed and thunder ka-BOOMED!":"Ahogy sötét, komor felhők úsztak a hold elé, villámok cikáztak, a mennydörgés pedig hatalmas dörrenéssel tört ki.",
  "The little dog dashed up the stairs, down the hall, and he shook all night long from the sounds of the squall.":"A kiskutya felrohant a lépcsőn, végigszaladt a folyosón, és egész éjjel remegett a vihar zajától.",

  "The rain cleared up and out came the sun.":"Elállt az eső, és kisütött a nap.",
  "The puppy was hungry.":"A kiskutya éhes volt.",
  "He looked all around for water and food.":"Körülnézett víz és élelem után.",
  "There was none to be found.":"Nem talált semmit.",
  "Soon day became night and then daytime once more, but no one came home to unlock the front door.":"Hamarosan nappalból éjszaka, majd újra nappal lett, ám senki sem jött haza, hogy kinyissa a bejárati ajtót.",
  "So he howled and he whimpered in terrible fear that no one would rescue him — no one would hear!":"Így hát üvöltött és nyüszített, szörnyű félelem gyötörte, hogy senki sem menti meg – senki sem hallja meg!",
  "This poor lonesome pup couldn't wait any more, so he clawed at the windows and pawed on the doors.":"Ez a szegény, magányos kiskutya már nem bírt tovább várni, ezért az ablakokat kaparta, az ajtókat pedig a mancsával döngette.",
  "He pushed on a screen, scratched a hole ‘til it grew.":"Megnyomott egy rácsot, és addig kaparta, míg lyuk nem keletkezett rajta, és az nagyobbra nem nőtt.",
  "Then he twisted and shoved and squeezed his way through.":"Aztán csavarodva, lökdösődve és préselődve átjutott.",
  "He was free now at last as he crept very slow through the woods and the darkness not sure where to go.":"Végre kiszabadult, miközben nagyon lassan lopakodott át a sötét erdőn, és a bizonytal volt afelől, merre is menjen.",

  "He was chased down the path by a mean old raccoon.":"Egy gonosz öreg mosómedve kergette végig az ösvényen.",
  "As he ran through a field, there were sharp prickly burrs that stuck to his toes, and his legs, and his fur.":"Ahogy átfutott a mezőn, éles, szúrós bogáncsok tapadtak a lábujjaira, a lábára és a bundájára.",
  "He was hurt once again on his way into town when he stepped on some glass all scattered around.":"A városba menet ismét megsérült, amikor rálépett valami összetört pohárra.",
  "He kept looking for someone, a friend who might care, but instead he heard Scram!":"Folyamatosan keresett valakit – egy barátot, akit talán érdekelne a dolog –, ám ehelyett csak annyit hallott: „Tűnés!”",
  "So he ran far from there.":"Így hát messzire futott onnan.",
  "Then he faced the worst danger of all on that night — A highway!":"Aztán azon az éjszakán szembe kellett néznie a legfőbb veszéllyel: egy országúttal!",

  "Headlights blinding his sight!":"Fényszórók vakítják el!",
  "He stopped.":"Megállt",
  "Then he turned.":"Aztán megfordult.",
  "When he started to go, a car blared its horn, tires screeched, and — OH, NO!":"Amikor elindult, egy autó dudált, a gumik felsikoltottak, és – Ó, ne!",
  "The car quickly stopped; someone opened the door.":"Az autó hirtelen megállt; valaki kinyitotta az ajtót.",
  "The pup froze!":"A kölyök megdermedt!",

  "Then a lady stepped out.":"Aztán egy hölgy lépett ki.",
  "Little Buddy! she cried.":"Kis pajtás! – kiáltotta.",
  "Are you lost?":"Eltévedtél?", "Are you hurt?":"Megsérültél?", "Let me get you inside!":"Hadd vigyelek be!",

e she came from, or where she has been.":"Nem vagyok biztos benne, honnan jött, vagy hol járt.","But it's time someone cared, for she needs a good meal.":"De ideje, hogy valaki törődjön vele, mert szüksége van egy jó ételre.","With those scratches and cuts, she could use time to heal.":"Azokkal a karcolásokkal és vágásokkal ráférne egy kis idő a gyógyulásra.","So we filled up a pan with fresh milk and chow.":"Így hát megtöltöttünk egy tálat friss tejjel és eleséggel.","After gulping it down, she sang friendly meows.":"Miután gyorsan lenyelte, barátságos nyávogásba kezdett.","We invited her in, but she lingered outside.":"Hívtuk be, de ő kint maradt.","We wondered if Cally had something to hide.":"Azon tűnődtünk, vajon Cally rejteget-e valamit.",

const storySelect=document.getElementById('storySelect'),storyBox=document.getElementById('storyBox'),status=document.getElementById('status'),gbBtn=document.getElementById('gbBtn'),usBtn=document.getElementById('usBtn'),dictLog=document.getElementById('dictLog');
let voices=[],voiceGB=null,voiceUS=null,currentAccent='en-GB',currentVoice=null;
function loadVoices(){voices=speechSynthesis.getVoices();voiceGB=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;voiceUS=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null;setAccent(currentAccent);}
function setAccent(a){currentAccent=a;currentVoice=a==='en-GB'?voiceGB:voiceUS;gbBtn.classList.toggle('active-accent',a==='en-GB');usBtn.classList.toggle('active-accent',a==='en-US');status.textContent=a+(currentVoice?' - '+currentVoice.name:'');}
loadVoices();speechSynthesis.onvoiceschanged=loadVoices;
gbBtn.onclick=()=>{setAccent('en-GB');if(speechSynthesis.speaking){speechSynthesis.cancel();speakFrom(pausedAtIndex);}};
usBtn.onclick=()=>{setAccent('en-US');if(speechSynthesis.speaking){speechSynthesis.cancel();speakFrom(pausedAtIndex);}};
let words=[],spans=[],active=null,pausedAtIndex=0,isPausedForDict=false,fullText='',isManualPause=false,sentences=[];
function normalizeKey(s){return s.toLowerCase().replace(/['’`]/g,'').replace(/[-–—]/g,' ').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();}
const NORM_DICT={};Object.entries(HU_DICT).forEach(([k,v])=>{NORM_DICT[normalizeKey(k)]=v;});
function findPhraseAt(i,max=5){for(let len=max;len>=1;len--){for(let st=Math.max(0,i-len+1);st<=i;st++){if(st+len>words.length)continue;let sl=words.slice(st,st+len).map(w=>w.clean).join(' ');let n=normalizeKey(sl);if(NORM_DICT[n]){if(sl.split(' ').length>6&&sentences.some(s=>s.norm===n))continue;return{data:NORM_DICT[n],start:st,end:st+len-1,phrase:words.slice(st,st+len).map(w=>w.text).join(' ')}}} }return null;}
function clearActive(){spans.forEach(s=>s.classList.remove('active'));}
function build(text){fullText=text;words=[];sentences=[];let tf=text.replace(/[-–—]/g,' ');let re=/\S+/g,m;while((m=re.exec(tf))!==null){let orig=text.substring(m.index,m.index+m[0].length);let cl=normalizeKey(m[0]);if(cl)words.push({text:orig,start:m.index,end:m.index+m[0].length,clean:cl});}let sr=/[^.!?]+[.!?]+/g,sm;while((sm=sr.exec(text))!==null){sentences.push({text:sm[0],start:sm.index,end:sm.index+sm[0].length,norm:normalizeKey(sm[0])});}if(!sentences.length&&text.trim())sentences.push({text:text,start:0,end:text.length,norm:normalizeKey(text)});let last=0,html='';words.forEach((w,i)=>{html+=text.substring(last,w.start);html+=`<span class="word" data-i="${i}">${w.text}</span>`;last=w.end;});html+=text.substring(last);storyBox.innerHTML=html;spans=storyBox.querySelectorAll('.word');spans.forEach(s=>{s.addEventListener('mouseenter',()=>{let idx=+s.dataset.i;let f=findPhraseAt(idx,4);clearActive();if(!f){spans[idx].classList.add('active');return;}for(let k=f.start;k<=f.end;k++)spans[k].classList.add('active');});s.addEventListener('mouseleave',()=>{if(!isPausedForDict)clearActive();});
s.addEventListener('click',()=>{let idx=+s.dataset.i;let f=findPhraseAt(idx,2);if(!f){showSent(idx);return;}if(speechSynthesis.speaking){speechSynthesis.cancel();isPausedForDict=true;pausedAtIndex=f.start;}clearActive();for(let k=f.start;k<=f.end;k++)spans[k].classList.add('active');let t=typeof f.data==='string'?f.data:f.data.map(v=>v.hu).join(' | ');dictLog.textContent=f.phrase+' → '+t;dictLog.style.display='block';});});}
function showSent(i){let cp=words[i]?.start??0;let sent=sentences.find(s=>cp>=s.start&&cp<s.end);if(sent&&NORM_DICT[sent.norm]){let h=typeof NORM_DICT[sent.norm]==='string'?NORM_DICT[sent.norm]:NORM_DICT[sent.norm].map(v=>v.hu).join(' | ');dictLog.textContent=h;dictLog.style.display='block';}}
function speakFrom(idx){if(idx>=words.length)return;showSent(idx);let utt=new SpeechSynthesisUtterance(fullText.substring(words[idx].start));utt.lang=currentAccent;if(currentVoice)utt.voice=currentVoice;utt.rate=0.9;let lastS=-1;utt.onboundary=e=>{if(e.name!=='word'||isPausedForDict||isManualPause)return;let abs=e.charIndex+words[idx].start;for(let i=idx;i<words.length;i++){if(abs>=words[i].start&&abs<words[i].end){clearActive();spans[i].classList.add('active');spans[i].scrollIntoView({block:'nearest',behavior:'smooth'});active=i;pausedAtIndex=i;let s=sentences.find(s=>abs>=s.start&&abs<s.end);if(s&&s.start!==lastS){lastS=s.start;if(NORM_DICT[s.norm]){let h=typeof NORM_DICT[s.norm]==='string'?NORM_DICT[s.norm]:NORM_DICT[s.norm].map(v=>v.hu).join(' | ');dictLog.textContent=h;dictLog.style.display='block';}}break;}}};utt.onstart=()=>{pauseBtn.disabled=false;stopBtn.disabled=false;};utt.onend=()=>{clearActive();active=null;};speechSynthesis.speak(utt);}
function loadStory(k){speechSynthesis.cancel();build(STORIES[k]);pausedAtIndex=0;active=null;isPausedForDict=false;isManualPause=false;dictLog.style.display='none';}
Object.keys(STORIES).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;storySelect.appendChild(o);});
loadStory(Object.keys(STORIES)[0]);
storySelect.onchange=e=>loadStory(e.target.value);
playBtn.onclick=()=>{speechSynthesis.cancel();isPausedForDict=false;isManualPause=false;if(active===null)pausedAtIndex=0;speakFrom(pausedAtIndex);};
pauseBtn.onclick=e=>{if(speechSynthesis.speaking){speechSynthesis.cancel();isManualPause=true;e.target.textContent='▶️';}else{isManualPause=false;e.target.textContent='⏸️';speakFrom(pausedAtIndex);}};
stopBtn.onclick=()=>{speechSynthesis.cancel();isPausedForDict=false;isManualPause=false;clearActive();active=null;pausedAtIndex=0;pauseBtn.textContent='⏸️';dictLog.style.display='none';};
</script>
