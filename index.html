<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyakorolj angolt olvasva és beszélve</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card{
    background:white;
    padding:48px 40px;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
    text-align:center;
    max-width:420px;
    width:90%;
  }
  h1{
    font-size:26px;
    color:#1a1a1a;
    margin-bottom:8px;
    line-height:1.3;
  }
  p{
    color:#666;
    font-size:15px;
    margin-bottom:32px;
  }
  .btn{
    display:block;
    width:100%;
    padding:16px;
    margin-bottom:14px;
    border:none;
    border-radius:12px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition: all 0.2s;
    text-decoration:none;
  }
  .btn-primary{
    background:#667eea;
    color:white;
  }
  .btn-primary:hover{
    background:#5a6fd6;
    transform: translateY(-1px);
  }
  .btn-secondary{
    background:#f3f4f6;
    color:#333;
  }
  .btn-secondary:hover{
    background:#e5e7eb;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Gyakorolj angolt<br>olvasva és beszélve</h1>
    <p>Válassz gyakorlási módot</p>
    
    <a href="js/olvas.html" class="btn btn-primary">📖 Olvasás</a>
    <a href="js/angbeszgyak.html" class="btn btn-secondary">🎤 Beszéd</a>
  </div>
</body>
</html>
