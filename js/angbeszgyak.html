  // --- DOM elements ---
  const langSelect = document.getElementById("langSelect");
  const wordSelect = document.getElementById("wordSelect");
  const playBtn = document.getElementById("playBtn");
  const recordBtn = document.getElementById("recordBtn");
  const nextBtn = document.getElementById("nextBtn");
  const resultDiv = document.getElementById("result");
  const spokenDiv = document.getElementById("spoken");

  const synth = window.speechSynthesis;
  const ut = new SpeechSynthesisUtterance();
  ut.rate = 0.9;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null;
  let recognizing = false;

  if (!SR) {
    resultDiv.textContent = "Ezen a készüléken a pontozás nem elérhető, de felolvasással gyakorolhatsz.";
    if(recordBtn) recordBtn.disabled = true;
  } else {
    recog = new SR();
    recog.interimResults = false;
    recog.maxAlternatives = 1;
    recog.continuous = false;
  }

  function similarity(a, b) {
    if (!a.length || !b.length) return 0;
    const matrix = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(null));
    for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
      }
    }
    return 1 - matrix[a.length][b.length] / Math.max(a.length, b.length);
  }

  function updateWordList() {
    const lang = langSelect.value;
    const dict = dictionaries[lang];
    if(!dict) return;
    wordSelect.innerHTML = "";
    for (let w in dict) {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = w;
      wordSelect.appendChild(opt);
    }
    wordSelect.selectedIndex = 0;
    if(recog){
      recog.lang = lang;
      ut.lang = lang;
    }
  }

  updateWordList();
  langSelect.onchange = updateWordList;

  playBtn.onclick = () => {
    ut.text = wordSelect.value;
    synth.speak(ut);
  };

  nextBtn.onclick = () => {
    const dict = dictionaries[langSelect.value];
    const keys = Object.keys(dict);
    wordSelect.value = keys[Math.floor(Math.random() * keys.length)];
    resultDiv.textContent = "";
    spokenDiv.textContent = "";
  };

  recordBtn.onclick = () => {
    if (!recog) return;
    if (recognizing) { recog.stop(); recognizing = false; return; }
    recognizing = true;
    resultDiv.textContent = "🎙️ Listening...";
    try { recog.start(); } catch(e){ recognizing = false; }
  };

  if(recog){
    recog.onresult = (event) => {
      recognizing = false;
      const word = wordSelect.value;
      const spoken = event.results[0][0].transcript.toLowerCase().trim();
      const variants = dictionaries[langSelect.value][word];
      let best = 0;
      for (let v of variants) {
        const s = similarity(spoken, v.toLowerCase());
        if (s > best) best = s;
      }
      spokenDiv.textContent = `You said: "${spoken}"`;
      resultDiv.innerHTML = best < 0.5 ? `❌ Low similarity (${(best * 100).toFixed(1)}%)` : `✅ Match ${(best * 100).toFixed(1)}%`;
    };
    recog.onerror = (e) => { recognizing = false; resultDiv.textContent = "⚠️ Error: " + e.error; };
    recog.onend = () => { recognizing = false; };
  }
});
